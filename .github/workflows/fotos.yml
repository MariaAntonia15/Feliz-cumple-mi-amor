name: Actualizar fotos del álbum

on:
  schedule:
    - cron: "17 * * * *"   # cada hora
  workflow_dispatch:        # botón "Run workflow" para actualizar al instante

permissions:
  contents: write

jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Leer el álbum de Google Fotos
        run: node herramientas/actualizar-fotos.js

      - name: Guardar fotos nuevas
        run: |
          if [ -z "$(git status --porcelain -- fotos-album.json)" ]; then
            echo "No hay fotos nuevas."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fotos-album.json
          git commit -m "Fotos del álbum actualizadas"
          git push
